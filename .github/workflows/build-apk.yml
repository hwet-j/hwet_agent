name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint & test
        run: |
          npx tsc --noEmit
          npx eslint src
          npm test

      - name: Generate native Android project (CNG)
        # 구글 OAuth 클라이언트 ID는 비밀값이 아니라서 저장소 Variables(Settings > Secrets and variables > Actions > Variables)에 둔다.
        # 비워 두면 구글 캘린더 연결만 꺼진 채로 빌드된다 (docs/google-calendar-setup.md).
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          # 앱이 "내 빌드 번호"를 알아야 새 버전 알림을 줄 수 있다 (릴리스 태그 assistant-apk-<번호> 와 같은 번호)
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Signing certificate fingerprint (구글 OAuth 클라이언트 등록용 SHA-1)
        id: sha
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHA1=$("$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-1 digest' | head -1 | awk '{print $NF}')
          echo "APK 서명 인증서 SHA-1: $SHA1"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk "../out/assistant-${GITHUB_RUN_NUMBER}.apk"
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: out/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA1: ${{ steps.sha.outputs.sha1 }}
        working-directory: .
        run: |
          # 간헐적인 403(권한 전파 지연)에 대비해 최대 3회 재시도
          for i in 1 2 3; do
            gh release create "assistant-apk-${GITHUB_RUN_NUMBER}" out/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "비서 APK #${GITHUB_RUN_NUMBER}" \
              --notes "폰에서 이 APK를 받아 설치하세요. (설정에서 '출처를 알 수 없는 앱 설치' 허용 필요)
          커밋: ${GITHUB_SHA::7}
          서명 인증서 SHA-1(구글 OAuth 클라이언트 등록용): ${SHA1}" && exit 0
            echo "릴리스 생성 실패 ($i/3), 20초 후 재시도"; sleep 20
          done
          exit 1
